name: Agent eval (manual, uses API quota)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        type: choice
        options: [gemini, groq, openrouter, anthropic]
        default: gemini
      split:
        description: "Question split"
        type: choice
        options: [all, dev, holdout]
        default: all

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      # inputs go through env vars, never straight into the script (prevents script injection)
      - run: uv run python evals/run_eval.py --provider "$PROVIDER" --split "$SPLIT"
        env:
          PROVIDER: ${{ inputs.provider }}
          SPLIT: ${{ inputs.split }}
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_RPM: ${{ vars.LLM_RPM }}
          LLM_RPD: ${{ vars.LLM_RPD }}
          HKRISK_QUOTA_DIR: ${{ runner.temp }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-results
          path: evals/results/
