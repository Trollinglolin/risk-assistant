[project]
name = "hkrisk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "205152841+Trollinglolin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "arch>=9.0.0",
    "boto3>=1.44.3",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
hkrisk = "hkrisk:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM API (costs quota); run with -m live"]

[tool.ruff]
line-length = 100
extend-exclude = ["dashboard"]

[tool.ruff.lint.per-file-ignores]
"src/hkrisk/api/*" = ["B008"]  # FastAPI Depends()/Query() defaults are idiomatic
